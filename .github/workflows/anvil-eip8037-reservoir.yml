# Builds anvil from this branch and publishes it as a prerelease, so CI
# elsewhere can download it instead of building foundry.
name: anvil-eip8037-reservoir

on:
  push:
    branches: [anvil-eip8037-reservoir]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Build anvil
        run: cargo build --release -p anvil --bin anvil
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="anvil-eip8037-${GITHUB_SHA::9}"
          cp target/release/anvil anvil
          gh release create "$tag" anvil \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "anvil (linux x86_64) built from $GITHUB_SHA on the anvil-eip8037-reservoir branch." \
            --prerelease
